<svg xmlns="http://www.w3.org/2000/svg" class="project-art" viewBox="0 0 900 480" role="img" aria-labelledby="pm_vital_lens_title pm_vital_lens_desc">
<title id="pm_vital_lens_title">From draft to journal</title><desc id="pm_vital_lens_desc">A conceptual app workflow with synthetic entries; no live photo analysis, health measurement or medical advice.</desc>
<metadata>Portfolio project illustration. Source: https://github.com/Ztang-Yit-Xiaang/Weight-Control-and-Body-Training. No scientific execution or performance claim. Generated by scripts/generate-project-animations.py.</metadata>
<style>
.project-art{--art-paper:var(--paper,#f7f2e9);--art-ink:var(--ink,#272820);--art-red:var(--red,#a54230);--art-sage:var(--sage,#526451);--art-line:var(--line,#d6ccbd);--art-wash:var(--wash,#eee6d9);font-family:Geist,"Noto Sans TC",Arial,sans-serif}
.project-art text{dominant-baseline:auto}.pointer-layer{transform:translate(var(--pointer-x,0px),var(--pointer-y,0px));transition:transform 500ms cubic-bezier(.22,1,.36,1)}
.art-animate{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.22,1,.36,1);transform-box:fill-box;transform-origin:center}
.flow{stroke-dasharray:8 12;animation-name:pm_vital_lens_flow;animation-timing-function:linear}
.pulse{animation-name:pm_vital_lens_pulse}.bob{animation-name:pm_vital_lens_bob}.bounce{animation-name:pm_vital_lens_bounce}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation-name:pm_vital_lens_draw}
.highlight{opacity:0;animation-name:pm_vital_lens_highlight}.later{animation-delay:-2.6s}.latest{animation-delay:-5.2s}
.typed{animation-name:pm_vital_lens_type;transform-box:fill-box}
@keyframes pm_vital_lens_flow{to{stroke-dashoffset:-160}}
@keyframes pm_vital_lens_pulse{0%,100%{opacity:.35}40%,70%{opacity:1}}
@keyframes pm_vital_lens_bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
@keyframes pm_vital_lens_bounce{0%,100%{transform:translateY(0)}25%{transform:translateY(105px)}50%{transform:translateY(25px)}75%{transform:translateY(125px)}}
@keyframes pm_vital_lens_draw{0%,5%,100%{stroke-dashoffset:1}55%,95%{stroke-dashoffset:0}}
@keyframes pm_vital_lens_highlight{0%,35%,100%{opacity:0}8%,28%{opacity:1}}
@keyframes pm_vital_lens_type{0%,8%,100%{clip-path:inset(0 100% 0 0)}50%,92%{clip-path:inset(0 0 0 0)}}
@media(prefers-reduced-motion:reduce){.art-animate{animation:none!important}.highlight{opacity:1}.pointer-layer{transform:none;transition:none}}
@media(prefers-color-scheme:dark){.project-art{--art-paper:var(--paper,#20221e);--art-ink:var(--ink,#f4ede1);--art-red:var(--red,#e79a80);--art-sage:var(--sage,#b2c3a4);--art-line:var(--line,#686456);--art-wash:var(--wash,#2c2e27)}}
</style>
<rect width="900" height="480" rx="20" fill="var(--art-paper)"/>
<text x="40" y="54" font-size="28" fill="var(--art-ink)" text-anchor="start" class="">From draft to journal</text><path d="M40 78H860" fill="none" stroke="var(--art-line)" stroke-width="1" class="" />
<g class="pointer-layer"><rect x="80" y="110" width="190" height="276" rx="22" fill="var(--art-paper)" stroke="var(--art-ink)" stroke-width="2" class=""/><rect x="98" y="151" width="154" height="90" rx="12" fill="var(--art-wash)" stroke="none" stroke-width="2" class=""/><text x="175" y="202" font-size="22" fill="var(--art-ink)" text-anchor="middle" class="">Sample meal</text><text x="175" y="279" font-size="22" fill="var(--art-ink)" text-anchor="middle" class="">Draft entry</text><path d="M300 235h60m-12 -8l12 8 -12 8" fill="none" stroke="var(--art-sage)" stroke-width="3" class="art-animate flow" /><rect x="390" y="170" width="195" height="58" rx="12" fill="var(--art-wash)" stroke="var(--art-line)" stroke-width="2" class=""/><text x="487.5" y="206" font-size="22" fill="var(--art-ink)" text-anchor="middle" class="">Review &amp; edit</text><text x="487" y="290" font-size="20" fill="var(--art-ink)" text-anchor="middle" class="">User stays in control</text><path d="M615 235h50m-12 -8l12 8 -12 8" fill="none" stroke="var(--art-sage)" stroke-width="3" class="art-animate flow" /><rect x="695" y="125" width="130" height="245" rx="12" fill="var(--art-wash)" stroke="var(--art-sage)" stroke-width="2" class=""/><path d="M712 170h95" fill="none" stroke="var(--art-sage)" stroke-width="4" class="art-animate pulse " /><path d="M712 215h95" fill="none" stroke="var(--art-sage)" stroke-width="4" class="art-animate pulse later" /><path d="M712 260h95" fill="none" stroke="var(--art-sage)" stroke-width="4" class="art-animate pulse latest" /><path d="M712 305h95" fill="none" stroke="var(--art-sage)" stroke-width="4" class="art-animate pulse later" /><text x="760" y="402" font-size="22" fill="var(--art-ink)" text-anchor="middle" class="">Journal</text></g>
<text x="40" y="433" font-size="15" fill="var(--art-ink)" text-anchor="start" class="">A conceptual app workflow with synthetic entries; no live photo analysis, health measurement or medical</text><text x="40" y="454" font-size="15" fill="var(--art-ink)" text-anchor="start" class="">advice.</text>
</svg>